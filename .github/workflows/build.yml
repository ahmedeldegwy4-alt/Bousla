name: Build APK
on:
  push:
    paths:
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/**'
      - 'docs/voices/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Restore signing key from secrets
        env:
          BOUSLA_KEYSTORE_B64: ${{ secrets.BOUSLA_KEYSTORE_B64 }}
          BOUSLA_KEY_PASS: ${{ secrets.BOUSLA_KEY_PASS }}
        run: |
          if [ -z "$BOUSLA_KEYSTORE_B64" ] || [ -z "$BOUSLA_KEY_PASS" ]; then
            echo "::error::Add BOUSLA_KEYSTORE_B64 and BOUSLA_KEY_PASS in Settings > Secrets and variables > Actions"; exit 1; fi
          echo "$BOUSLA_KEYSTORE_B64" | base64 -d > app/bousla.jks
      - run: gradle :app:assembleDebug --no-daemon
        env:
          BOUSLA_KEY_PASS: ${{ secrets.BOUSLA_KEY_PASS }}
      - uses: actions/upload-artifact@v4
        with:
          name: bousla-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Bousla.apk
          gh release delete latest --yes --cleanup-tag || true
          echo "${{ github.run_number }}" > version.txt
          gh release create latest Bousla.apk version.txt --title "بوصلة قلبك — آخر نسخة" --notes "نزّل Bousla.apk وثبّته على الموبايل."
