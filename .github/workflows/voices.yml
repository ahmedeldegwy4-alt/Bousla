name: Fetch voices
on:
  push:
    paths: ['voices/urls.json']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  voices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - run: python3 voices/process.py
      - name: Commit voices
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/voices
          git commit -m "أصوات التنبيهات (ElevenLabs)" || echo "no changes"
          git push
      - name: Rebuild APK with the voices
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref main
