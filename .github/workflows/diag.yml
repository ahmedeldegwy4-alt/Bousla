name: Diag stream
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          for n in 1 2 114; do
          curl -sL -m 15 -A "Mozilla/5.0 (Linux; Android 14)" https://surahquran.com/mp3/Al-Ghamdi/$n.html -o g.html
          grep -oE '(src|href|data-src)=["]?[^"> ]+\.mp3' g.html | sort -u | sed "s/^/MP$n>>/"
          done
          u=$(grep -oE 'https?://[^"> ]+\.mp3' g.html | head -1); echo "MPU>>$u"; curl -sIL -m 8 "$u" | grep -iE '^HTTP|content-type|content-length|location' | sed 's/^/MPH>>/'
          curl -sIL -m 8 https://server7.mp3quran.net/s_gmd/001.mp3 | grep -iE '^HTTP|content-type|content-length' | sed 's/^/MPQ>>/'
