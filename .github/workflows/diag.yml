name: Diag stream
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          curl -sL -m 15 -A "Mozilla/5.0 (Linux; Android 14)" https://surahquran.com/mp3/Al-Ghamdi -o g.html
          grep -oiE '(mp3|audio|server|\.net|\.com)[^"<> ]{0,120}' g.html | grep -viE 'surahquran.com/(mp3/[A-Z]|[0-9]+\.html|Tajweed|Radio|css|js|img)|facebook|google|twitter|png|jpg|webp|svg|font' | sort -u | head -40
          echo ---; grep -oE '<script[^>]*src="[^"]+"' g.html
          echo ---; grep -oE '<a [^>]*href="[^"]+"' g.html | sed -n '40,60p'
          echo ---; sed -n '/<audio/,/<\/audio>/p' g.html | head -5
