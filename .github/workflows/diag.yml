name: Diag stream
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          curl -sL -m 15 -A "Mozilla/5.0 (Linux; Android 14)" https://surahquran.com/Tajweed/ -o t.html -D h.txt
          grep -iE 'x-frame|content-security' h.txt
          python3 - <<'PY'
          import re,html
          s=open('t.html',encoding='utf-8').read()
          for m in re.finditer(r'<a[^>]+href="([^"]*)"[^>]*>(.*?)</a>',s,re.S):
              h,t=m.group(1),re.sub('<[^>]+>','',m.group(2)).strip()
              if 'Tajweed' in h or (h.endswith('.html') and '/' not in h): print('LK|'+h.replace('‏','').replace('‎','')+'|'+html.unescape(t))
          PY
