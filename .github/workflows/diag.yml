name: Diag stream
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          curl -sL -m 15 -A "Mozilla/5.0 (Linux; Android 14)" https://surahquran.com/mp3/Al-Ghamdi -o g.html
          python3 - <<'PY'
          import re
          s=open('g.html',encoding='utf-8').read()
          for m in re.finditer(r'<script(?![^>]*src)[^>]*>(.*?)</script>',s,re.S):
              t=m.group(1).strip()
              if t and 'adsbygoogle' not in t[:60]: print('SCRIPT>>',t[:1500].replace('\n',' '))
          i=s.find('الفاتحة'); print('CTX>>',re.sub(r'\s+',' ',s[i-800:i+600]))
          PY
