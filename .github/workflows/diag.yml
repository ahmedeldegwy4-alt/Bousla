name: Diag stream
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for p in Cairo Saudi Algeria Morocco UAE USA noor Khashia Mix Sudais Dosari Afasi Abdulbasit Baqarah Tafseer Qatar Qatar106 Bahrain Jordan Kuwait Oman Pakistan Palestine Sharjah; do
            h=$(curl -sL -m 15 -A "Mozilla/5.0" "https://surahquran.com/Radio-Quran-$p.html")
            t=$(echo "$h" | grep -o '<title>[^<]*' | head -1 | sed 's/<title>//')
            for u in $(echo "$h" | grep -oE 'https?://[^"'"'"' <>]+' | grep -iE 'stream|radio|\.mp3|m3u8|:[0-9]{4}|live|icecast|zeno|listen' | grep -viE 'surahquran\.com|\.(png|jpg|css|js|html)|facebook|twitter|google' | sort -u); do
              r=$(curl -sL -m 6 -r 0-2000 -o /dev/null -w '%{http_code} %{content_type} %{url_effective}' "$u" 2>/dev/null)
              echo "ST|$p|$t|$u|$r"
            done
          done
