name: Diag stream
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sL -m 15 -A "Mozilla/5.0 (Linux; Android 14)" "https://surahquran.com/Radio-Quran-Saudi.html" -o s.html -w 'code=%{http_code}\n'; wc -c s.html
          grep -oiE '(src|href|file|url|data-[a-z]+)\s*[=:]\s*["'"'"'][^"'"'"']+' s.html | grep -viE '\.(png|jpg|svg|css|webp|ico)|Radio-Quran-|facebook|twitter' | sort -u | head -60
