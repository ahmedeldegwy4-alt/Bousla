name: Diag stream
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          for p in Cairo Saudi Algeria Morocco UAE USA noor Khashia Mix Sudais Dosari Afasi Abdulbasit Baqarah Tafseer Qatar Qatar106 Bahrain Jordan Kuwait Oman Pakistan Palestine Sharjah; do
            curl -sL -m 15 -A "Mozilla/5.0 (Linux; Android 14)" "https://surahquran.com/Radio-Quran-$p.html" -o p.html
            for u in $(grep -oE 'data-src="[^"]+' p.html | sed 's/data-src="//' | sort -u); do
              r=$(curl -sL -m 6 -r 0-3000 -o /dev/null -w '%{http_code} %{content_type} %{url_effective}' "$u" 2>/dev/null; true)
              echo "ST|$p|$u|$r"
            done
          done
